<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富88 - 正在進入官網</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, #FCF9F2 0%, #F0E5D1 100%);
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        .redirect-card {
            background-color: #FFFFFF;
            width: 90%;
            max-width: 420px;
            padding: 20px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 5px solid #D4AF37;
        }

        .video-container {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        .logo-video {
            width: 100%;
            height: auto;
            display: block;
        }

        .progress-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 5px;
            margin: 0 auto 15px;
        }

        .progress-block {
            flex: 1;
            height: 12px;
            background-color: #F0E5D1;
            border-radius: 2px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .progress-block.active {
            background-color: #D4AF37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        h2 {
            color: #333333;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .manual-wrapper {
            margin-bottom: 15px;
        }

        .manual-text {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .manual-btn {
            display: inline-block;
            color: #D4AF37;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            border: 1px solid #D4AF37;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .manual-btn:hover {
            background-color: #D4AF37;
            color: #FFFFFF;
        }

        .trust-badges {
            padding-top: 15px;
            border-top: 1px dashed #E0E0E0;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .badge {
            font-size: 12px;
            color: #666666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge::before {
            content: '\2714';
            color: #28A745;
            font-weight: bold;
        }
    </style>
</head>

<!-- GA4 Tracking will be initialized at the bottom -->

<body>

    <div class="redirect-card">
        <div class="video-container">
            <video class="logo-video" autoplay loop muted playsinline>
                <source src="assets/images/logo_motion.mp4" type="video/mp4">
            </video>
        </div>

        <div class="progress-container" id="progress-blocks">
            <!-- Blocks generated by JS -->
        </div>

        <h2 id="status-text">載入中...</h2>

        <div class="manual-wrapper">
            <div class="manual-text">沒有自動跳轉?</div>
            <a href="https://ry6668.com/ag/metameta/auth/register" class="manual-btn">手動進入官網</a>
        </div>

        <div class="trust-badges">
            <div class="badge">正版授權</div>
            <div class="badge">安全防護</div>
            <div class="badge">杜絕山寨</div>
        </div>
    </div>

    <script>
        const targetUrl = "https://ry6668.com/ag/metameta/auth/register";
        const totalDuration = 4800;
        const statusText = document.getElementById('status-text');
        const blocksContainer = document.getElementById('progress-blocks');
        const numBlocks = 12;

        // Initialize blocks
        for (let i = 0; i < numBlocks; i++) {
            const block = document.createElement('div');
            block.className = 'progress-block';
            blocksContainer.appendChild(block);
        }
        const blocks = blocksContainer.getElementsByClassName('progress-block');

        let startTime = null;

        function animate(currentTime) {
            if (!startTime) startTime = currentTime;
            const elapsed = currentTime - startTime;
            const timeProgress = Math.min(elapsed / totalDuration, 1);

            let visualProgress;
            if (timeProgress < 0.2) {
                // Fast start: 0% to 70% in 20% of the time
                visualProgress = timeProgress * 3.5;
                statusText.innerText = "載入組件中...";
            } else if (timeProgress < 0.6) {
                // Slow down: 70% to 90% in 40% of the time
                visualProgress = 0.7 + (timeProgress - 0.2) * 0.5;
                statusText.innerText = "最佳化連線環境...";
            } else {
                // Very slow end: 90% to 100% in 40% of the time
                visualProgress = 0.9 + (timeProgress - 0.6) * 0.25;
                statusText.innerText = "即將進入，請稍後!";
            }

            const activeCount = Math.floor(Math.min(visualProgress, 1) * numBlocks);
            for (let i = 0; i < blocks.length; i++) {
                if (i < activeCount) {
                    blocks[i].classList.add('active');
                } else {
                    blocks[i].classList.remove('active');
                }
            }

            if (timeProgress < 1) {
                requestAnimationFrame(animate);
            } else {
                trackEvent('auto_redirect', { 'destination': targetUrl });
                window.location.replace(targetUrl);
            }
        }

        // --- GA4 Tracking Configuration ---
        const GA_CONFIG = {
            id: 'G-YTZW1QE0YS' // ⬅️ 這裡編輯您的 GA ID
        };

        function initGA() {
            if (!GA_CONFIG.id) return;

            const script = document.createElement('script');
            script.async = true;
            script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_CONFIG.id}`;
            document.head.appendChild(script);

            window.dataLayer = window.dataLayer || [];
            window.gtag = function () { dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', GA_CONFIG.id);
            console.log(`GA4 Initialized: ${GA_CONFIG.id}`);
        }

        function trackEvent(eventName, params = {}) {
            if (window.gtag) {
                gtag('event', eventName, params);
            }
        }

        // Add event listeners for button clicks
        document.querySelector('.manual-btn').addEventListener('click', (e) => {
            trackEvent('manual_button_click', {
                'button_name': 'manual_redirect',
                'destination': targetUrl
            });
        });

        window.onload = () => {
            initGA();
            trackEvent('page_load', { 'page_title': document.title });
            requestAnimationFrame(animate);
        };
    </script>

</body>

</html>
